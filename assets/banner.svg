<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="40%" stop-color="#0a1128" />
      <stop offset="80%" stop-color="#0b1a3a" />
      <stop offset="100%" stop-color="#050914" />
    </linearGradient>

    <radialGradient id="cyber-glow-1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyber-glow-2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="shield-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e0f2fe" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="pill-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.04); }
      }
      @keyframes scanline {
        0% { transform: translateY(-380px); }
        100% { transform: translateY(380px); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .floating-pill-1 { animation: floatSlow 5s ease-in-out infinite; }
      .floating-pill-2 { animation: floatReverse 6s ease-in-out infinite; }
      .floating-pill-3 { animation: floatSlow 7s ease-in-out infinite 1s; }
      .floating-pill-4 { animation: floatReverse 5.5s ease-in-out infinite 0.5s; }
      .pulsing-glow { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
      .radar-arm { animation: radarSweep 10s linear infinite; transform-origin: 600px 190px; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="380" fill="url(#bg-grad)" rx="16" />

  <!-- Ambient Glowing Blobs -->
  <circle cx="240" cy="110" r="280" fill="url(#cyber-glow-1)" />
  <circle cx="960" cy="270" r="320" fill="url(#cyber-glow-2)" />

  <!-- Grid Pattern -->
  <g stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="190" x2="1200" y2="190" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="290" x2="1200" y2="290" />
    <line x1="0" y1="340" x2="1200" y2="340" />

    <line x1="100" y1="0" x2="100" y2="380" />
    <line x1="220" y1="0" x2="220" y2="380" />
    <line x1="340" y1="0" x2="340" y2="380" />
    <line x1="460" y1="0" x2="460" y2="380" />
    <line x1="580" y1="0" x2="580" y2="380" />
    <line x1="700" y1="0" x2="700" y2="380" />
    <line x1="820" y1="0" x2="820" y2="380" />
    <line x1="940" y1="0" x2="940" y2="380" />
    <line x1="1060" y1="0" x2="1060" y2="380" />
  </g>

  <!-- Circuit & Node Network (Background Dynamic Detail) -->
  <g stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25" fill="none">
    <path d="M 80 190 L 160 190 L 200 230 L 320 230" />
    <path d="M 880 150 L 980 150 L 1020 110 L 1120 110" />
    <path d="M 840 260 L 920 260 L 960 300 L 1080 300" />
  </g>
  <g fill="#38bdf8" fill-opacity="0.4">
    <circle cx="80" cy="190" r="3" />
    <circle cx="200" cy="230" r="3" />
    <circle cx="320" cy="230" r="3" />
    <circle cx="880" cy="150" r="3" />
    <circle cx="1020" cy="110" r="3" />
    <circle cx="1120" cy="110" r="3" />
    <circle cx="840" cy="260" r="3" />
    <circle cx="1080" cy="300" r="3" />
  </g>

  <!-- Glowing Radar Circle in Center (Subtle Background) -->
  <g opacity="0.25">
    <circle cx="600" cy="190" r="140" stroke="#38bdf8" stroke-width="1" fill="none" stroke-dasharray="4 6" />
    <circle cx="600" cy="190" r="90" stroke="#818cf8" stroke-width="0.8" fill="none" />
    <circle cx="600" cy="190" r="40" stroke="#38bdf8" stroke-width="0.8" fill="none" />
  </g>

  <!-- Background Animated Pill Elements (Positioned away from center text) -->
  <!-- Top Left Pill -->
  <g class="floating-pill-1" transform="translate(60, 48)">
    <rect width="180" height="34" rx="17" fill="url(#pill-grad-1)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="17" r="4" fill="#38bdf8" />
    <text x="32" y="22" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Static Analysis</text>
  </g>

  <!-- Top Right Pill -->
  <g class="floating-pill-2" transform="translate(950, 48)">
    <rect width="190" height="34" rx="17" fill="url(#pill-grad-1)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="17" r="4" fill="#818cf8" />
    <text x="32" y="22" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Formal Verification</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="floating-pill-3" transform="translate(70, 308)">
    <rect width="195" height="34" rx="17" fill="url(#pill-grad-1)" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="17" r="4" fill="#34d399" />
    <text x="32" y="22" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Runtime Monitoring</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="floating-pill-4" transform="translate(940, 308)">
    <rect width="195" height="34" rx="17" fill="url(#pill-grad-1)" stroke="#f472b6" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="17" r="4" fill="#f472b6" />
    <text x="32" y="22" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Symbolic Execution</text>
  </g>

  <!-- FOREGROUND CONTENT: Shield Icon, Title, and Subtitle (Always in Front) -->
  <g id="foreground-hero" filter="url(#subtle-shadow)" transform="translate(0, 0)">
    <!-- Central Shield & Lock Emblem -->
    <g transform="translate(600, 105)">
      <!-- Pulsing Shield Glow -->
      <circle cx="0" cy="0" r="42" fill="url(#shield-glow)" class="pulsing-glow" />
      
      <!-- Shield Base Shape -->
      <path d="M 0 -28 L 24 -18 L 24 6 C 24 20 12 30 0 34 C -12 30 -24 20 -24 6 L -24 -18 Z" 
            fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
      
      <!-- Shield Inner Core (Lock / Check) -->
      <path d="M -8 2 L -2 8 L 8 -2" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Main Title -->
    <text x="600" y="195" text-anchor="middle"
          fill="url(#title-grad)"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="34" font-weight="800" letter-spacing="-0.5px">
      Awesome Smart Contract Flaw Verification Tools
    </text>

    <!-- Subtitle -->
    <text x="600" y="235" text-anchor="middle"
          fill="#94a3b8"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="16" font-weight="500" letter-spacing="0.2px">
      Curated Directory of Top SaaS Platforms, Fuzzers, Static Scanners &amp; Formal Verification Engines
    </text>

    <!-- Status Badges Bar -->
    <g transform="translate(365, 262)">
      <!-- Badge 1: EVM & Multi-Chain -->
      <rect x="0" y="0" width="135" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6" />
      <text x="67" y="17" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">⚡ EVM &amp; Multi-Chain</text>

      <!-- Badge 2: Automated & Manual -->
      <rect x="150" y="0" width="165" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.6" />
      <text x="232" y="17" text-anchor="middle" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">🛡️ Automated &amp; Manual</text>

      <!-- Badge 3: Open-Source First -->
      <rect x="330" y="0" width="140" height="26" rx="13" fill="#1e293b" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.6" />
      <text x="400" y="17" text-anchor="middle" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">💎 Open-Source First</text>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect width="1200" height="380" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35" />
</svg>
